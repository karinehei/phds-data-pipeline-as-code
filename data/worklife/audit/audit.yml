age_note: Taulukossa 115s ei ole ikämuuttujaa. Tapausotteen kuvaus rajaa tapaukset
  15–64-vuotiaisiin. Haettu dokumentaatio määrittelee työlliset 18–74-vuotiaiksi.
  Ikärajat eivät siis ole samat.
geography_note: Taulukon aluemääre sisältää arvon SSS (koko maa) ja alueen MK21 (MK21
  Ahvenanmaa). Vuosina 2019–2023 alueiden summa vastaa koko maan lukua, joten koko
  maan nimittäjä sisältää Ahvenanmaan. Ahvenanmaan työllisten keskiarvo on 14242.
  Tapausote ei sisällä Ahvenanmaata.
reference_note: Dokumentaation mukaan väestö kuvataan vuoden viimeisen päivän tilannetta
  ja toiminta vuoden viimeistä viikkoa.
classification_note: Ammattimuuttuja on Ammattiryhmä (ammatti_104_20161021). Dokumentaatio
  sanoo, että ammateissa käytetään kulloinkin voimassa olevaa Tilastokeskuksen ammattiluokitusta.
  Paketin README nimeää luokituksen AML 2010.
