# CI: lint, test, report, artifacts. Optional: deploy to GitHub Pages on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libglpk-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies (renv)
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      - name: Require the lockfile
        if: hashFiles('renv.lock') == ''
        run: |
          echo "renv.lock is missing. CI restores only the pinned library."
          exit 1

      - name: Lint
        run: Rscript -e "if (requireNamespace('lintr', quietly=TRUE)) lintr::lint_dir('R') else message('lintr not installed, skipping')"
        continue-on-error: true

      - name: Acquire the verified worklife snapshot
        run: make worklife-acquire

      - name: Test
        run: Rscript run-tests.R

      - name: Build the pediatric report
        run: make report

      - name: Build the worklife report from the saved audit
        run: make worklife

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: phds-report
          path: output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            output/
            data/synthetic/visits.parquet

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-outputs

      - name: Prepare the shared front page
        run: cp site/index.html output/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
